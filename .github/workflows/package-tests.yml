name: "Package Tests"

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'systole/**'
      - 'tests/**'
      - 'scripts/run-tests.sh'
      - 'channels-lock.scm'
      - '.github/workflows/package-tests.yml'
      - '.github/actions/install-guix/**'
  push:
    branches:
      - main
      - dev
    paths:
      - 'systole/**'
      - 'tests/**'
      - 'channels-lock.scm'

jobs:
  package-tests:
    name: Module + package checks (pinned Guix)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The release Guix is only a bootstrap: every check runs through
      # `guix time-machine -C channels-lock.scm`, i.e. against the
      # exact Guix + channel commits the project actually ships with,
      # not the bootstrap Guix.
      - name: Install Guix (bootstrap)
        uses: ./.github/actions/install-guix

      - name: Run package tests against pinned channels
        env:
          GUIX: guix time-machine -C channels-lock.scm --
        run: ./scripts/run-tests.sh packages
