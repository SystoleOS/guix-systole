name: "Guix Lint Check"

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'systole/**'
      - 'tests/lint-allowlist.regex'
      - 'scripts/run-tests.sh'
      - 'channels-lock.scm'
      - '.github/workflows/guix-lint-check.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'systole/**'
      - 'channels-lock.scm'

jobs:
  guix-lint:
    name: guix lint (pinned Guix)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bootstrap only; the lint itself runs through time-machine so it
      # uses the pinned Guix + channels from channels-lock.scm.
      - name: Install Guix (bootstrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y guix

      # The package list and the warning allowlist live in
      # scripts/run-tests.sh and tests/lint-allowlist.regex -- single
      # source of truth shared with local runs.  `guix lint` exits 0
      # even on warnings; run-tests.sh gates on filtered output.
      - name: Run lint against pinned channels
        env:
          GUIX: guix time-machine -C channels-lock.scm --
        run: ./scripts/run-tests.sh lint
